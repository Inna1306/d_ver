<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ничего не найдено</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="logo" href="index.html"><span class="logo__mark">&#128218;</span>лого</a>
  <nav class="topbar__nav">
    <a href="index.html#map">Библиотеки</a>
    <a href="index.html#about">О нас</a>
    <a href="index.html#contacts">Контакты</a>
    <a href="login.html">Вход</a>
  </nav>
</header>
<main class="screen">
  <div class="page">
    <div class="page__header">
      <h1 class="page__title" style="font-size:24px">Поиск книги</h1>
<form class="hero-form" action="search.html" method="get">
  <div class="field field--full">
    <label class="field__label" for="f-name">Название</label>
    <input class="field__input" id="f-name" name="name" type="text" placeholder="Введите название книги" value="Путь 1С-разработчика">
  </div>
  <div class="field field--full">
    <label class="field__label" for="f-author">Автор</label>
    <input class="field__input" id="f-author" name="author" type="text" placeholder="Введите автора" value="">
  </div>
  <div class="field">
    <label class="field__label" for="f-out">Выдача книги</label>
    <input class="field__input" id="f-out" name="issue" type="date" value="">
  </div>
  <div class="field">
    <label class="field__label" for="f-ret">Возврат книги</label>
    <input class="field__input" id="f-ret" name="return" type="date" value="">
  </div>
  <div class="field--full"><button class="btn btn--primary" type="submit">Найти</button></div>
</form>
    </div>
    <div class="empty">
      <div class="empty__icon">?</div>
      <h2 class="empty__title">По вашему запросу ничего не найдено</h2>
      <p class="empty__text">К сожалению, по указанным данным книга не найдена. Проверьте правильность написания или попробуйте изменить параметры поиска (автор, название, дата).</p>
    </div>
  </div>
</main>
<footer class="footer" id="contacts">
  <img class="blob blob--right" src="assets/amorphous-shape-2.svg" alt="">
  <img class="blob blob--left" src="assets/amorphous-shape-3.svg" alt="">
  <div class="footer__inner">
    <div class="footer__logo">лого</div>
    <div class="footer__social">
      <a class="social-link" href="#" aria-label="ВКонтакте"><img src="assets/social-vk.svg" alt="VK"></a>
      <a class="social-link" href="#" aria-label="Telegram"><img src="assets/social-telegram.svg" alt="Telegram"></a>
      <a class="social-link" href="#" aria-label="Одноклассники"><img src="assets/social-odnoklassniki.svg" alt="OK"></a>
      <a class="social-link" href="#" aria-label="YouTube"><img src="assets/social-youtube.svg" alt="YouTube"></a>
    </div>
    <p class="footer__policy">Политика обработки персональных данных</p>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
