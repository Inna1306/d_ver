<!DOCTYPE html>
<html lang="ru">
<head>

<title>Личный кабинет — читатель</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="logo" href="index.html"><span class="logo__mark">&#128218;</span>лого</a>
  <nav class="topbar__nav">
    <a href="index.html#map">Библиотеки</a>
    <a href="index.html#about">О нас</a>
    <a href="index.html#contacts">Контакты</a>
    <a href="login.html">Вход</a>
  </nav>

<main class="screen">
  <div class="page">
    <div class="account">

      <img class="avatar" src="assets/avatars/avatar 4.svg" alt="Аватар">
      <h2 class="account__name">Привет, Капитолина!</h2>
      <p class="account__role">Читатель</p>

    </aside>
      <section class="account__content">
        <h2 class="section-title">Добро пожаловать в личный кабинет!</h2>
        <div class="welcome-stats">
          <div class="stat"><strong>12</strong><span>Вы забронировали книг</span></div>

    </div>

<footer class="footer" id="contacts">
  <img class="blob blob--right" src="assets/amorphous-shape-2.svg" alt="">
  <img class="blob blob--left" src="assets/amorphous-shape-3.svg" alt="">
  <div class="footer__inner">
    <div class="footer__logo">лого</div>
    <div class="footer__social">
      <a class="social-link" href="#" aria-label="ВКонтакте"><img src="assets/social-vk.svg" alt="VK"></a>

      <a class="social-link" href="#" aria-label="YouTube"><img src="assets/social-youtube.svg" alt="YouTube"></a>
    </div>
    <p class="footer__policy">Политика обработки персональных данных</p>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
